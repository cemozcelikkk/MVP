[project]
name = "karavantr-backend"
version = "0.1.0"
description = "KaravanTR - Türkiye pazarına özel karavan/off-grid topluluk platformu backend API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",      # form-data / dosya (foto) yüklemeleri için

    # --- Veritabanı ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",              # async PostgreSQL driver
    "geoalchemy2>=0.15.2",          # PostGIS <-> SQLAlchemy köprüsü
    "alembic>=1.13.2",              # migration yönetimi
    "greenlet>=3.0.3",              # SQLAlchemy async için gerekli

    # --- Coğrafi veri ---
    "shapely>=2.0.4",               # WKB <-> GeoJSON dönüşümleri

    # --- Doğrulama / Ayarlar ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.1",       # Pydantic EmailStr için

    # --- Kimlik doğrulama ---
    "passlib>=1.7.4",
    # passlib 1.7.4, bcrypt>=4.1'in kaldırdığı `__about__.__version__`
    # attribute'una bakarak sürüm tespiti yapıyor; bu olmadan "(trapped)
    # error reading bcrypt version" uyarısı ve hash_password()'da sessiz
    # bir ValueError ile karşılaşılıyor. passlib'in resmi bir düzeltmesi
    # olmadığından bcrypt bilinen uyumlu bir sürüme sabitlendi.
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3.0",

    # --- Medya / Depolama ---
    "Pillow>=10.4.0",                # görsel işleme: EXIF, resize, WebP dönüşümü
    "aioboto3>=13.1.1",              # async S3/Cloudflare R2 istemcisi

    # --- Yardımcı ---
    "python-dotenv>=1.0.1",
    "orjson>=3.10.3",               # hızlı JSON serileştirme (GeoJSON payload'ları için)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "factory-boy>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `app.core.database.engine`/`AsyncSessionLocal` modül seviyesinde TEK bir
# singleton - pytest-asyncio'nun varsayılanı (fonksiyon başına YENİ bir
# event loop) ile bu, bir testte açılan asyncpg bağlantısının başka bir
# testin (farklı/kapanmış) event loop'unda temizlenmeye çalışılmasına
# ("Event loop is closed" / "attribute 'send'") yol açıyordu - Windows'ta
# ProactorEventLoop + asyncpg ile özellikle görünür. Tüm test oturumunun
# TEK bir event loop paylaşmasını zorlayarak çözülüyor.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
